<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Fonso - URL Note Taker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
            <h1>📝 Fonso - URL Note Taker</h1>
            <p>Save and organize URLs</p>
        </header>
        
        <main class="app-main">
            <!-- Form section for adding new notes -->
            <div class="form-section">
                <h2>Add New URL Note</h2>
                <form id="note-form" class="note-form">
                    <div class="form-group">
                        <label for="url">URL *</label>
                        <input 
                            type="url" 
                            id="url" 
                            name="url" 
                            placeholder="https://example.com" 
                            required
                            class="form-input"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            placeholder="Enter a descriptive title" 
                            required
                            class="form-input"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="summary">Summary</label>
                        <textarea 
                            id="summary" 
                            name="summary" 
                            placeholder="What's interesting about this URL? Why did you save it?"
                            rows="4"
                            class="form-textarea"
                        ></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input 
                            type="datetime-local" 
                            id="date" 
                            name="date" 
                            class="form-input"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="tags">Tags</label>
                        <input 
                            type="text" 
                            id="tags" 
                            name="tags" 
                            placeholder="javascript, tutorial, beginner (comma-separated)"
                            class="form-input"
                        >
                        <small class="form-hint">Separate multiple tags with commas</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        💾 Save Note
                    </button>
                </form>
            </div>
            
            <!-- Notes display section -->
            <div class="notes-section">
                <div class="notes-header">
                    <h2>Your Saved Notes</h2>
                    <div class="header-actions">
                        <div class="notes-count">
                            <span id="notes-count">0</span> notes
                        </div>
                        <div class="export-import-buttons">
                            <button id="export-btn" class="btn btn-export" title="Export notes to JSON file">
                                📤 Export
                            </button>
                            <button id="import-btn" class="btn btn-import" title="Import notes from JSON file">
                                📥 Import
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Search bar -->
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input 
                            type="text" 
                            id="search-input" 
                            class="search-input" 
                            placeholder="Search notes by keyword..."
                            autocomplete="off"
                        >
                        <button 
                            id="clear-search-btn" 
                            class="btn-clear-search" 
                            title="Clear search"
                            style="display: none;"
                        >
                            ✕
                        </button>
                    </div>
                </div>
                
                <div id="notes-list" class="notes-list">
                    <div class="empty-state">
                        <p>No notes yet. Add your first URL note!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- We'll add the renderer script in Phase 3 -->
    <script src="renderer.js"></script>
</body>
</html>
